<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Exclusive VIP Credit Card Event Offer. Claim your 10% credit off your selected show." />
    <meta name="theme-color" content="#1a0505" />
    <title>Premium Credit Card Offer</title>
    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- Gold Sparkle Canvas -->
    <canvas id="sparkle-canvas"></canvas>

    <!-- Background Blobs from Reference Repo -->
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <div id="app" class="state-initial">
      
      <!-- Main Scene Container -->
      <div class="scene">
        <!-- Main Credit Card -->
        <div id="main-card" class="card main-card">
          <div class="card-inner">
            <div class="card-front glass">
              <div class="card-glare"></div>
              <div class="card-content">
                <div class="card-logo">VIP</div>
                <div class="card-chip"></div>
                <div class="card-number">•••• •••• •••• 1234</div>
                <div class="card-name">JOHN DOE</div>
                <div class="tap-hint"><span class="tap-pulse">✦</span> Tap to reveal your offer</div>
              </div>
            </div>
            <div class="card-back glass">
              <div class="magnetic-stripe"></div>
              <div class="signature-strip">
                <span class="offer-text">10% off your selected show!</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Event Cards Container -->
        <div id="events-container" class="events-container" role="list">
          <button class="event-card glass" data-event="Middle East" aria-label="Select Middle East Event" role="listitem">
            <img src="./assets/logo-middle-east.svg" alt="Lubricant Expo Middle East" class="event-logo">
            <p>Click here to select this event</p>
          </button>
          <button class="event-card glass" data-event="North America" aria-label="Select North America Event" role="listitem">
            <img src="./assets/logo-north-america.svg" alt="Lubricant Expo North America" class="event-logo">
            <p>Click here to select this event</p>
          </button>
          <button class="event-card glass" data-event="Europe" aria-label="Select Europe Event" role="listitem">
            <img src="./assets/logo-europe.svg" alt="Lubricant Expo Europe" class="event-logo">
            <p>Click here to select this event</p>
          </button>
        </div>
      </div>

      <!-- Email Modal Overlay -->
      <div id="email-modal" class="modal-overlay hidden" role="dialog" aria-labelledby="modal-title" aria-modal="true">
        <div class="modal-content glass">
          <button id="close-modal" class="close-btn" aria-label="Close dialog">&times;</button>
          <h2 id="modal-title">Claim your 10% credit off <span id="modal-event-name">this Event</span></h2>
          <form id="email-form">
            <div class="input-group">
              <input type="email" id="email-input" name="email" placeholder=" " required autocomplete="email" />
              <label for="email-input">Your Email Address</label>
            </div>
            <button type="submit" class="submit-btn" aria-live="polite">
              <span class="btn-text">Claim Offer</span>
              <span class="spinner hidden" aria-hidden="true"></span>
            </button>
          </form>
        </div>
      </div>
      
    </div>

    <!-- Success Badge (shown after claiming) -->
    <div id="success-badge" class="success-badge hidden">
      <span class="success-icon">✔</span>
      <span>Offer Claimed! Check your inbox.</span>
    </div>

    <!-- Confetti Script -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="./main.js" defer></script>
  </body>
</html>
